name: File 09 R22 Historical QA Align

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
    paths:
      - r22-qa-align.trigger

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0
      - name: Align historical DoD range assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changed=[]
          for p in sorted(Path('tests').glob('*.py')):
              src=p.read_text(encoding='utf-8')
              out=[]
              touched=False
              for line in src.splitlines(True):
                  new=line
                  if 'DoD-' in line:
                      new=new.replace('range(1,14)', 'range(1,13)')
                      new=new.replace('range(1, 14)', 'range(1, 13)')
                  if new != line:
                      touched=True
                  out.append(new)
              if touched:
                  p.write_text(''.join(out), encoding='utf-8')
                  changed.append(str(p))
          print('aligned files:', changed)
          remaining=[]
          for p in sorted(Path('tests').glob('*.py')):
              for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  if 'DoD-13' in line:
                      remaining.append(f'{p}:{n}:{line.strip()}')
          print('remaining direct DoD-13 assertions:')
          print('\n'.join(remaining) if remaining else 'NONE')
          PY
      - name: Commit alignment
        run: |
          if git diff --quiet; then
            echo "No historical QA range changes required"
            exit 0
          fi
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          git add tests
          git commit -m "test(file09): align historical DoD assertions with governing DoD-12"
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
