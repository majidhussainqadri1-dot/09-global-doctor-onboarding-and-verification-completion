name: File 09 R9 Source Corrective Apply

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          extensions: openssl,fileinfo,gd
      - name: Apply R9 source corrections against frozen R8 exact-head baseline
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 75ea54ed5113bf7ee16e90443f17cc1b941933a9 HEAD
          python3 tools/r9-source-apply.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/eighty-round-audit-r5.py')
          s=p.read_text(encoding='utf-8')
          old="c(13,'Continuous monitor orphan deletion failure is surfaced',has(hard,'gdo_trust_monitor_orphan_delete','false === $wpdb->delete'))"
          new="c(13,'Continuous monitor orphan deletion failure is surfaced',has(hard,'gdo_trust_monitor_orphan_delete',\"'monitor_status'=>'processing'\",'orphan_delete_failed'))"
          if old not in s: raise SystemExit('R5 monitor assertion anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git rm -f .github/workflows/file09-r9-apply.yml tools/r9-source-apply.py
      - name: Validate corrected source before commit
        run: |
          set -euo pipefail
          git diff --check
          find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 php -l >/dev/null
          node --check assets/js/onboarding.js
          php tests/security-unit.php
          php tests/membership-adapter.php
          php tests/policy-runtime.php
          php tests/cf01-practitioner-contract.php
          php tests/cf01-practitioner.php
          php tests/cross-file-contracts.php
          python3 tests/architecture-check.py
          python3 tests/completion-security.py
          python3 tests/release-integrity.py
          python3 tests/rc2-adversarial.py
          python3 tests/final-hardening.py
          python3 tests/review40-adversarial.py
          python3 tests/latest-plan-parity.py
          python3 tests/advanced-trust-24.py
          python3 tests/eighty-round-audit.py
          python3 tests/eighty-round-audit-r2.py
          python3 tests/eighty-round-audit-r3.py
          python3 tests/eighty-round-audit-r4.py
          python3 tests/eighty-round-audit-r5.py
          python3 tests/eighty-round-audit-r6.py
          python3 tests/eighty-round-audit-r7.py
          python3 tests/eighty-round-audit-r8.py
      - name: Commit corrected R9 source
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(file09): ninth fresh source corrective assurance'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
