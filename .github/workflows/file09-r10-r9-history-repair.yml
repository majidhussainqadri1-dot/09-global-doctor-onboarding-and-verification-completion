name: File 09 R10 Historical R9 Harness Repair

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Decouple historical R9 assertions from mutable current release metadata
        run: |
          set -euo pipefail
          python3 tools/r10-r9-history-repair.py
          git rm -f .github/workflows/file09-r10-r9-history-repair.yml tools/r10-r9-history-repair.py
          python3 tests/eighty-round-audit-r9.py
          python3 tests/eighty-round-audit-r10.py
          git diff --check
      - name: Commit historical harness repair
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(file09): preserve R9 history under R10 release truth'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
