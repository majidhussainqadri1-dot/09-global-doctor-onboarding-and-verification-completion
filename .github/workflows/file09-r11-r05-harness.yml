name: File 09 R11 R05 Harness Correction
on:
  push:
    branches: [codex/file09-1.3.0-rc6-80-round-review]
    paths: ['.github/workflows/file09-r11-r05-harness.yml']
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0
      - name: Align R11 R05 with actual fail-closed semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/eighty-round-audit-r11.py')
          s=p.read_text()
          old="c(5,'Rate limiter isolates post-upsert counter read database state',has(rate,\"$wpdb->last_error = ''\",'$raw_hits = $wpdb->get_var','gdo_rate_limit_query'))"
          new="c(5,'Rate limiter isolates post-upsert counter read database state',has(rate,\"$wpdb->last_error = ''\",'$raw_hits = $wpdb->get_var','null === $raw_hits','return false;'))"
          if old not in s: raise SystemExit('R11 R05 assertion anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          python3 -m py_compile tests/eighty-round-audit-r11.py
      - name: Commit harness correction
        run: |
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/eighty-round-audit-r11.py
          git commit -m 'test(file09): align R11 rate-limit assertion with source semantics'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review