name: File 09 R15 corrective apply helper

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
    paths:
      - r15-apply.json

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0
      - name: Apply exact R15 replacement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          spec=json.loads(Path('r15-apply.json').read_text(encoding='utf-8'))
          for change in spec['changes']:
              p=Path(change['path'])
              s=p.read_text(encoding='utf-8')
              old=change['old']
              new=change['new']
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f"{p}: expected exactly one old fragment, found {count}")
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          git add -- $(python3 - <<'PY'
          import json
          from pathlib import Path
          print(' '.join(c['path'] for c in json.loads(Path('r15-apply.json').read_text())['changes']))
          PY
          )
          if git diff --cached --quiet; then
            echo 'No source changes produced' >&2
            exit 1
          fi
          msg=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('r15-apply.json').read_text())['message'])
          PY
          )
          git commit -m "$msg"
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
