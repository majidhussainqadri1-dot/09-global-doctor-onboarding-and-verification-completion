name: File 09 R13 source correction apply

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
    paths:
      - 'tools/file09-r13-patch-part*.txt'
      - '.github/workflows/file09-r13-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0
      - name: Apply reviewed R13 correction and self-clean
        run: |
          set -euo pipefail
          cat tools/file09-r13-patch-part*.txt > /tmp/file09-r13.patch
          git apply --check /tmp/file09-r13.patch
          git apply /tmp/file09-r13.patch
          rm -f tools/file09-r13-patch-part*.txt .github/workflows/file09-r13-apply.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(file09): complete R13 source corrections'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
