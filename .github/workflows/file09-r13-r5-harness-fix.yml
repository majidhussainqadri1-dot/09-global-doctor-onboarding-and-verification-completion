name: File 09 R13 R5 historical harness adaptation

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
    paths:
      - '.github/workflows/file09-r13-r5-harness-fix.yml'

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0
      - name: Adapt historical R5 deletion-proof assertion and self-clean
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/eighty-round-audit-r5.py')
          s = p.read_text(encoding='utf-8')
          old = "c(46,'Physical evidence deletion proof remains present',has(privacy,'delete_verified','deletion_proof'))"
          new = "c(46,'Physical evidence deletion proof remains present',has(evidence,'function delete_record_safely','deletion_proof','deletion_pending_erasure','deletion_pending_retention') and has(privacy,'GDO_Evidence::delete_record_safely') and has(retention,'GDO_Evidence::delete_record_safely'))"
          if old not in s:
              raise SystemExit('expected R5 historical assertion not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/file09-r13-r5-harness-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(file09): adapt R5 deletion-proof gate to R13 primitive'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
