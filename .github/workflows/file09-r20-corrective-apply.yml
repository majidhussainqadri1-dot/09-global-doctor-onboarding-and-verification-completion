name: File 09 R20 Corrective Apply

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
    paths:
      - r20-apply.json
      - .github/workflows/file09-r20-corrective-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0
      - name: Apply exact replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec = json.loads(Path('r20-apply.json').read_text(encoding='utf-8'))
          for item in spec.get('replacements', []):
              path = Path(item['path'])
              old = item['old']
              new = item['new']
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              expected = int(item.get('count', 1))
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} exact match(es), found {count}')
              path.write_text(text.replace(old, new, expected), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm r20-apply.json
          git commit -m "${{ github.event.head_commit.message }} [applied]"
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
