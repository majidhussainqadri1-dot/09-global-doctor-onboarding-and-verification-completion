name: File 09 R9 Evidence Sync

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Synchronize R9 evidence documents
        run: |
          set -euo pipefail
          python3 tools/r9-doc-sync.py
          git rm -f .github/workflows/file09-r9-doc-sync.yml tools/r9-doc-sync.py
          git diff --check
      - name: Commit R9 evidence synchronization
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(file09): synchronize ninth review evidence'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
