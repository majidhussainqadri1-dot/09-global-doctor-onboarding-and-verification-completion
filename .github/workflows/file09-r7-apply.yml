name: Apply File 09 R7 Corrective Review

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          extensions: openssl,fileinfo,gd
      - name: Apply R7 root-cause corrections and evidence
        run: |
          set -euo pipefail
          python3 -m py_compile tools/r7-apply.py
          python3 tools/r7-apply.py
          sed -i 's/in workflow))/in workflow)/' tests/eighty-round-audit-r7.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/eighty-round-audit-r6.py')
          s=p.read_text(encoding='utf-8')
          old="c(80,'Sixth fresh ledger/gate/release lock/package count synchronized',(root/'REVIEW-80-ROUNDS-RC6-R6.md').exists() and lock.get('sixth_review_baseline')=='6fa0a5cb7063b6b821bd50c105c735470f589b80' and lock.get('sixth_review_rounds')==80 and lock.get('sixth_defect_rounds')==60 and lock.get('sixth_clean_rounds')==20 and lock.get('release_file_count')==57 and len(release_files)==57 and 'REVIEW-80-ROUNDS-RC6-R6.md' in release_files and 'python3 tests/eighty-round-audit-r6.py' in workflow and '**57-entry**' in manifest)"
          new="c(80,'Sixth fresh historical ledger/gate evidence remains preserved',(root/'REVIEW-80-ROUNDS-RC6-R6.md').exists() and lock.get('sixth_review_baseline')=='6fa0a5cb7063b6b821bd50c105c735470f589b80' and lock.get('sixth_review_rounds')==80 and lock.get('sixth_defect_rounds')==60 and lock.get('sixth_clean_rounds')==20 and 'REVIEW-80-ROUNDS-RC6-R6.md' in release_files and 'python3 tests/eighty-round-audit-r6.py' in workflow and '**57-entry**' in manifest)"
          if old not in s:
              raise SystemExit('R6 historical package-count assertion anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate corrected R7 tree
        run: |
          set -euo pipefail
          git rm -f .github/workflows/file09-r7-apply.yml
          git diff --check
          python3 -m py_compile tests/eighty-round-audit-r6.py tests/eighty-round-audit-r7.py
          find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 php -l >/dev/null
          node --check assets/js/onboarding.js
          php tests/security-unit.php
          php tests/membership-adapter.php
          php tests/policy-runtime.php
          php tests/cf01-practitioner-contract.php
          php tests/cf01-practitioner.php
          php tests/cross-file-contracts.php
          python3 tests/architecture-check.py
          python3 tests/completion-security.py
          python3 tests/release-integrity.py
          python3 tests/rc2-adversarial.py
          python3 tests/final-hardening.py
          python3 tests/review40-adversarial.py
          python3 tests/latest-plan-parity.py
          python3 tests/advanced-trust-24.py
          python3 tests/eighty-round-audit.py
          python3 tests/eighty-round-audit-r2.py
          python3 tests/eighty-round-audit-r3.py
          python3 tests/eighty-round-audit-r4.py
          python3 tests/eighty-round-audit-r5.py
          python3 tests/eighty-round-audit-r6.py
          python3 tests/eighty-round-audit-r7.py
          EXPECTED_SHA=$(git rev-parse HEAD) GITHUB_SHA=$(git rev-parse HEAD) python3 tools/build-release.py --output dist-a
          EXPECTED_SHA=$(git rev-parse HEAD) GITHUB_SHA=$(git rev-parse HEAD) python3 tools/build-release.py --output dist-b
          cmp dist-a/global-doctor-onboarding-09-1.3.0-RC6.zip dist-b/global-doctor-onboarding-09-1.3.0-RC6.zip
          python3 tools/verify-release.py dist-a/global-doctor-onboarding-09-1.3.0-RC6.zip RELEASE-FILES.txt
      - name: Commit R7 corrections and remove temporary tooling
        run: |
          set -euo pipefail
          rm -rf dist-a dist-b
          git rm -f tools/r7-apply.py
          git add -A
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(file09): seventh fresh 80-round corrective assurance'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
