name: Apply File 09 RC2 Corrective Overlay

on:
  push:
    branches:
      - codex/file09-1.2.0-final-correction
    paths:
      - tools/finalize/file09-rc2.ready

permissions:
  contents: write

jobs:
  apply-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: codex/file09-1.2.0-final-correction

      - name: Verify and decode bounded overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/finalize/file09-rc2.ready
          mapfile -t chunks < <(find tools/finalize -maxdepth 1 -type f -name 'file09-rc2.part-*' -print | sort)
          test "${#chunks[@]}" -eq 12
          cat "${chunks[@]}" > /tmp/file09-rc2.b64
          base64 --decode /tmp/file09-rc2.b64 > /tmp/file09-rc2.tar.gz
          echo "18f319c0186908929a1597f5f6d1f76d8a6dc396e06621a84cf869d161f6af4f  /tmp/file09-rc2.tar.gz" | sha256sum --check
          python3 - <<'PY'
          import tarfile
          from pathlib import PurePosixPath
          with tarfile.open('/tmp/file09-rc2.tar.gz','r:gz') as tf:
              members=tf.getmembers()
              if len(members) != 21:
                  raise SystemExit(f'unexpected overlay member count: {len(members)}')
              for member in members:
                  path=PurePosixPath(member.name)
                  if not member.isfile() or member.issym() or member.islnk() or path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe overlay member: {member.name}')
                  if path.parts and path.parts[0] == '.github':
                      raise SystemExit(f'workflow mutation prohibited in overlay: {member.name}')
          PY

      - name: Apply overlay atomically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile
          with tarfile.open('/tmp/file09-rc2.tar.gz','r:gz') as tf:
              tf.extractall('.')
          PY
          rm -rf tools/finalize
          rm -f /tmp/file09-rc2.b64 /tmp/file09-rc2.tar.gz
          git diff --check
          find includes -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
          php -l tests/application-validation.php
          python3 -m py_compile tests/completion-security.py tests/release-integrity.py tests/source-inventory.py tools/build-release.py

      - name: Commit corrective overlay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete File 09 RC2 corrective source overlay"
          git push origin HEAD:codex/file09-1.2.0-final-correction
