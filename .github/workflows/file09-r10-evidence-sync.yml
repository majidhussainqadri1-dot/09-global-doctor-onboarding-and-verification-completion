name: File 09 R10 Evidence Sync

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Apply R10 evidence synchronization
        run: |
          set -euo pipefail
          python3 tools/r10-evidence-sync.py
          git rm -f .github/workflows/file09-r10-evidence-sync.yml tools/r10-evidence-sync.py
          git diff --check
          python3 tests/release-integrity.py
          python3 tests/latest-plan-parity.py
          python3 tests/eighty-round-audit-r10.py
      - name: Commit synchronized R10 evidence
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(file09): synchronize tenth review evidence'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
