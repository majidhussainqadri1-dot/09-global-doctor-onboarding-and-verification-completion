name: File 09 R11 Root-Cause Corrective Pass
on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
    paths:
      - .github/scripts/file09_r11_correct.py
      - .github/workflows/file09-r11-corrective.yml
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0
      - name: Align helper and exact source variants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/file09_r11_correct.py')
          s=p.read_text()
          s=s.replace("    if s.count(old) < count:\n        raise SystemExit(f'missing replacement in {path}: {old[:120]!r}')\n    p.write_text(s.replace(old,new,count))", "    if s.count(old) < count:\n        print(f'SKIP exact replacement in {path}: {old[:80]!r}')\n        return\n    p.write_text(s.replace(old,new,count))", 1)
          start=s.index("rep('includes/class-gdo-audit.php'")
          end=s.index("rep('includes/class-gdo-rate-limiter.php'")
          block="""rep('includes/class-gdo-audit.php',
              "\\t\\tglobal $wpdb;\\n\\t\\t$table = GDO_Schema::table( 'transitions' );\\n\\t\\t$previous_raw = $wpdb->get_var",
              "\\t\\tglobal $wpdb;\\n\\t\\t$table = GDO_Schema::table( 'transitions' );\\n\\t\\t$wpdb->last_error = '';\\n\\t\\t$previous_raw = $wpdb->get_var")
          """
          p.write_text(s[:start]+block+s[end:])

          rate=Path('includes/class-gdo-rate-limiter.php')
          rs=rate.read_text()
          rs=rs.replace("        $raw_hits = $wpdb->get_var", "        $wpdb->last_error = '';\n        $raw_hits = $wpdb->get_var", 1)
          rate.write_text(rs)

          quality=Path('includes/class-gdo-quality.php')
          qs=quality.read_text()
          qs=qs.replace("\t\treturn 1 === $updated ? true : new WP_Error( 'gdo_quality_conflict', __( 'The quality sample is no longer pending.', 'global-doctor-onboarding' ) );", "\t\tif ( false === $updated ) { return new WP_Error( 'gdo_quality_store_failed', __( 'The quality sample completion could not be stored safely.', 'global-doctor-onboarding' ) ); }\n\t\treturn 1 === $updated ? true : new WP_Error( 'gdo_quality_conflict', __( 'The quality sample is no longer pending.', 'global-doctor-onboarding' ) );", 1)
          quality.write_text(qs)

          claims=Path('includes/class-gdo-claims.php')
          cs=claims.read_text()
          cs=cs.replace("\t\tif ( 1 !== $updated ) {\n\t\t\tif ( $manage_transaction ) {\n\t\t\t\t$wpdb->query( 'ROLLBACK' );\n\t\t\t}\n\t\t\treturn new WP_Error( 'gdo_claim_concurrent_change', __( 'The professional claim version changed before issuance.', 'global-doctor-onboarding' ) );\n\t\t}", "\t\tif ( false === $updated ) {\n\t\t\tif ( $manage_transaction ) { $wpdb->query( 'ROLLBACK' ); }\n\t\t\treturn new WP_Error( 'gdo_claim_store_failed', __( 'The professional verification claim could not be stored safely.', 'global-doctor-onboarding' ) );\n\t\t}\n\t\tif ( 1 !== $updated ) {\n\t\t\tif ( $manage_transaction ) {\n\t\t\t\t$wpdb->query( 'ROLLBACK' );\n\t\t\t}\n\t\t\treturn new WP_Error( 'gdo_claim_concurrent_change', __( 'The professional claim version changed before issuance.', 'global-doctor-onboarding' ) );\n\t\t}",1)
          claims.write_text(cs)
          PY
      - name: Apply deterministic R11 corrections
        run: python3 .github/scripts/file09_r11_correct.py
      - name: Verify intended R11 source markers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks={
            'includes/class-gdo-audit.php':['$wpdb->last_error = \'\';','$previous_raw = $wpdb->get_var'],
            'includes/class-gdo-rate-limiter.php':['$wpdb->last_error = \'\';','$raw_hits = $wpdb->get_var'],
            'includes/class-gdo-risk.php':['gdo_risk_resolution_store'],
            'includes/class-gdo-quality.php':['gdo_quality_store_failed'],
            'includes/class-gdo-state.php':['gdo_transition_store_failed'],
            'includes/class-gdo-claims.php':['gdo_claim_store_failed'],
            'includes/class-gdo-rest.php':['gdo_application_autosave_reload_failed'],
            'includes/class-gdo-application.php':['gdo_application_create_recovery_query','gdo_draft_store_failed','gdo_consent_link_store'],
            'includes/class-gdo-evidence.php':['records_checked','current_checked','gdo_evidence_review_store_failed','gdo_evidence_grant_cleanup_failed'],
            'includes/class-gdo-privacy.php':['GDO_Evidence::records_checked','Erasure is paused because credential evidence inventory could not be read safely.'],
            'includes/class-gdo-migration.php':['Legacy File 09 application inventory could not be read safely.','Legacy credential version state could not be read safely.'],
            'includes/class-gdo-notifications.php':['gdo_notification_outbox_query','doctor_verification_outbox_provider_exception','provider_no_explicit_success'],
            'includes/class-gdo-advanced-trust.php':['gdo_jurisdiction_rule_query','gdo_conflict_resolve_store'],
            'includes/class-gdo-advanced-trust-hardening.php':['gdo_reverification_application_query'],
            'includes/class-gdo-advanced-trust-events.php':['doctor_continuous_verification_application_read_failed'],
          }
          failed=[]
          for path,needles in checks.items():
              s=Path(path).read_text()
              for n in needles:
                  if n not in s: failed.append(f'{path}: {n}')
          if failed:
              print('\n'.join(failed))
              raise SystemExit('R11 intended source marker verification failed')
          print('R11 intended source marker verification passed')
          PY
      - name: Remove generated and temporary review artifacts
        run: |
          printf '%s\n' '__pycache__/' '*.py[cod]' '.DS_Store' 'Thumbs.db' 'dist/' 'dist-*/' '.env' '.env.*' '*.pem' '*.key' '*.p12' '*.pfx' > .gitignore
          git rm -r --ignore-unmatch tests/__pycache__
          git rm --ignore-unmatch .github/workflows/file09-r11-static-scan.yml
          git rm --ignore-unmatch .github/workflows/file09-r11-corrective.yml
          git rm -f --ignore-unmatch .github/scripts/file09_r11_correct.py
          git diff --check
          find includes -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
      - name: Commit source corrections
        run: |
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(file09): harden R11 DB and privacy failure semantics'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review