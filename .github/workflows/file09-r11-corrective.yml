name: File 09 R11 Root-Cause Corrective Pass
on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
    paths:
      - .github/scripts/file09_r11_correct.py
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0
      - name: Apply deterministic R11 corrections
        run: python3 .github/scripts/file09_r11_correct.py
      - name: Remove generated and temporary review artifacts
        run: |
          printf '%s\n' '__pycache__/' '*.py[cod]' '.DS_Store' 'Thumbs.db' 'dist/' 'dist-*/' '.env' '.env.*' '*.pem' '*.key' '*.p12' '*.pfx' > .gitignore
          git rm -r --ignore-unmatch tests/__pycache__
          git rm --ignore-unmatch .github/workflows/file09-r11-static-scan.yml
          git rm --ignore-unmatch .github/workflows/file09-r11-corrective.yml
          git rm --ignore-unmatch .github/scripts/file09_r11_correct.py
          git diff --check
          find includes -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
      - name: Commit source corrections
        run: |
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(file09): harden R11 DB and privacy failure semantics'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review