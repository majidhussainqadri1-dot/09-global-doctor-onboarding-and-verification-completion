name: File 09 R9 Executable Gate Repair

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Repair and preflight R9 executable gate
        run: |
          set -euo pipefail
          python3 tools/r9-test-repair.py
          git rm -f .github/workflows/file09-r9-test-repair.yml tools/r9-test-repair.py
          python3 -m py_compile tests/eighty-round-audit-r9.py
          python3 tests/eighty-round-audit-r9.py
          git diff --check
      - name: Commit repaired R9 executable gate
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(file09): repair ninth 80-round executable gate'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
