name: Apply File 09 Third 80-Round Corrections

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout staging head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Check trigger
        id: gate
        shell: bash
        run: |
          if [[ -f R3-APPLY-TRIGGER.txt && -f tools/file09-r3-apply.py ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply third-review root-cause corrections
        if: steps.gate.outputs.apply == 'true'
        run: python3 tools/file09-r3-apply.py
      - name: Set up PHP 8.3
        if: steps.gate.outputs.apply == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          extensions: openssl,fileinfo,gd
      - name: Validate corrected source
        if: steps.gate.outputs.apply == 'true'
        run: |
          set -euo pipefail
          git diff --check
          find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 php -l >/dev/null
          node --check assets/js/onboarding.js
          php tests/security-unit.php
          php tests/membership-adapter.php
          php tests/policy-runtime.php
          php tests/cf01-practitioner-contract.php
          php tests/cf01-practitioner.php
          php tests/cross-file-contracts.php
          python3 tests/architecture-check.py
          python3 tests/completion-security.py
          python3 tests/release-integrity.py
          python3 tests/final-hardening.py
          python3 tests/review40-adversarial.py
          python3 tests/latest-plan-parity.py
          python3 tests/advanced-trust-24.py
          python3 tests/eighty-round-audit.py
          python3 tests/eighty-round-audit-r2.py
      - name: Commit third-review code corrections
        if: steps.gate.outputs.apply == 'true'
        run: |
          set -euo pipefail
          git rm -f R3-APPLY-TRIGGER.txt tools/file09-r3-apply.py
          git add includes/ tests/review40-adversarial.py
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(file09): third 80-round root-cause hardening'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
