name: Apply File 09 Fresh-Second 80-Round Corrections

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[r2-patch-stage]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout staging head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Apply compressed corrective patch
        run: |
          set -euo pipefail
          cat tools/file09-r2.patch.xz.b64.part01 \
              tools/file09-r2.patch.xz.b64.part02 \
              tools/file09-r2.patch.xz.b64.part03 \
              tools/file09-r2.patch.xz.b64.part04 \
              tools/file09-r2.patch.xz.b64.part05 \
              tools/file09-r2.patch.xz.b64.part06 | base64 -d > /tmp/file09-r2.patch.xz
          xz -dc /tmp/file09-r2.patch.xz > /tmp/file09-r2.patch
          patch -p3 --batch --forward < /tmp/file09-r2.patch
      - name: Synchronize repository-only release evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          rel=Path('RELEASE-FILES.txt')
          files=[x for x in rel.read_text(encoding='utf-8').splitlines() if x.strip()]
          if 'REVIEW-80-ROUNDS-RC6-R2.md' not in files:
              files.append('REVIEW-80-ROUNDS-RC6-R2.md')
          rel.write_text('\n'.join(files)+'\n',encoding='utf-8')
          if len(files)!=53: raise SystemExit(f'unexpected final release allowlist size: {len(files)}')

          for name in ['README.md','STATUS.md','RELEASE-MANIFEST-1.3.0.md','STAGING-ACCEPTANCE.md']:
              p=Path(name); t=p.read_text(encoding='utf-8').replace('52-entry','53-entry')
              p.write_text(t,encoding='utf-8')

          p=Path('CHANGELOG.md'); t=p.read_text(encoding='utf-8')
          t=t.replace('52-entry deterministic package','53-entry deterministic package')
          marker='## 1.3.0-RC6 — Eighty-Round Corrective Assurance — 2026-08-10\n'
          extra='\n- Fresh-second independent 80-control re-review against `c3fbbadbee06d2be13b23822f5f17fce07cdab4e`: **47 defect-bearing rounds corrected; 33 clean rounds**; added `tests/eighty-round-audit-r2.py` and `REVIEW-80-ROUNDS-RC6-R2.md`.\n'
          if 'Fresh-second independent 80-control re-review' not in t:
              if marker not in t: raise SystemExit('changelog RC6 marker missing')
              t=t.replace(marker,marker+extra,1)
          p.write_text(t,encoding='utf-8')

          p=Path('README.md'); t=p.read_text(encoding='utf-8')
          table='| Founder-requested 80-round review | `REVIEW-80-ROUNDS-RC6.md`: 80 rounds; 49 defect-bearing corrected; 31 clean |\n'
          second='| Fresh-second 80-round re-review | `REVIEW-80-ROUNDS-RC6-R2.md`: 80 rounds; 47 defect-bearing corrected; 33 clean |\n'
          if second not in t:
              if table not in t: raise SystemExit('README review row missing')
              t=t.replace(table,table+second,1)
          t=t.replace('`REVIEW-80-ROUNDS-RC6.md`, `SECURITY-PRIVACY.md`','`REVIEW-80-ROUNDS-RC6.md`, `REVIEW-80-ROUNDS-RC6-R2.md`, `SECURITY-PRIVACY.md`')
          t=t.replace('RC6 then completed **80 additional independent controls: 49 defect-bearing rounds corrected and 31 clean rounds**.','RC6 then completed **80 additional independent controls: 49 defect-bearing rounds corrected and 31 clean rounds**. A fresh-second independent RC6 review then completed **80 further controls: 47 defect-bearing rounds corrected and 33 clean rounds**.')
          p.write_text(t,encoding='utf-8')

          lockp=Path('RELEASE-LOCK.json'); lock=json.loads(lockp.read_text(encoding='utf-8'))
          lock['release_file_count']=53
          lock['second_review_baseline']='c3fbbadbee06d2be13b23822f5f17fce07cdab4e'
          lock['second_review_rounds']=80
          lock['second_defect_rounds']=47
          lock['second_clean_rounds']=33
          lockp.write_text(json.dumps(lock,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          p=Path('tools/build-release.py'); t=p.read_text(encoding='utf-8')
          old="'release_candidate':release_candidate,'source_head':head,'review_rounds':80,'defect_rounds':49,"
          new="'release_candidate':release_candidate,'source_head':head,'review_rounds':80,'defect_rounds':49,'second_review_rounds':80,'second_defect_rounds':47,'second_clean_rounds':33,"
          if old not in t and new not in t: raise SystemExit('build-release assurance fields not found')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')

          p=Path('tests/release-integrity.py'); t=p.read_text(encoding='utf-8')
          old="lock.get('release_candidate')!='RC6' or lock.get('review_rounds')!=80 or lock.get('defect_rounds')!=49 or lock.get('release_file_count')!=len(release_files)"
          new="lock.get('release_candidate')!='RC6' or lock.get('review_rounds')!=80 or lock.get('defect_rounds')!=49 or lock.get('second_review_rounds')!=80 or lock.get('second_defect_rounds')!=47 or lock.get('second_clean_rounds')!=33 or lock.get('second_review_baseline')!='c3fbbadbee06d2be13b23822f5f17fce07cdab4e' or lock.get('release_file_count')!=len(release_files)"
          if old not in t and new not in t: raise SystemExit('release-integrity lock predicate not found')
          t=t.replace(old,new,1)
          old2="'includes/class-gdo-advanced-trust-events.php','ADVANCED-TRUST-24.md','REVIEW-80-ROUNDS-RC6.md']"
          new2="'includes/class-gdo-advanced-trust-events.php','ADVANCED-TRUST-24.md','REVIEW-80-ROUNDS-RC6.md','REVIEW-80-ROUNDS-RC6-R2.md']"
          if old2 not in t and new2 not in t: raise SystemExit('release-integrity release-evidence list not found')
          t=t.replace(old2,new2,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: PHP 8.3 sanity
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          extensions: openssl,fileinfo,gd
      - name: Validate patched source before committing
        run: |
          set -euo pipefail
          git diff --check
          find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 php -l >/dev/null
          node --check assets/js/onboarding.js
          python3 tests/release-integrity.py
      - name: Commit corrected source and remove patch transport
        run: |
          set -euo pipefail
          git rm -f R2-APPLY-TRIGGER.txt
          git rm tools/file09-r2.patch.xz.b64.part01 tools/file09-r2.patch.xz.b64.part02 tools/file09-r2.patch.xz.b64.part03 tools/file09-r2.patch.xz.b64.part04 tools/file09-r2.patch.xz.b64.part05 tools/file09-r2.patch.xz.b64.part06
          git add -A
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(file09): fresh second 80-round corrective closure'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
