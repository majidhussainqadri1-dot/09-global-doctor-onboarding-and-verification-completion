name: File 09 Corrective Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - audit/file-09-source-review

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Architecture and authority checks
        run: python3 tests/architecture-check.py
      - name: Repository hygiene
        run: |
          test ! -e .github/workflows/bootstrap-file09-corrective.yml
          ! grep -RInE '(BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9]{20,})' . --exclude-dir=.git
          ! find . -type f \( -name '*.zip' -o -name '*.sql' -o -name '*.sqlite' -o -name '.env' -o -name 'wp-config.php' \) | grep .

  php-lint-and-security:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.3']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: openssl,fileinfo,gd
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 php -l
      - name: Deterministic security unit tests
        run: php tests/security-unit.php
      - name: Whitespace validation
        run: git diff --check
