name: Package File 09 1.2.0
on:
  pull_request:
  push:
    branches: ["codex/**", "audit/**"]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with: {php-version: '8.3', coverage: none, extensions: 'openssl,fileinfo,gd'}
      - name: Verify source
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 php -l
          php tests/security-unit.php
          php tests/membership-adapter.php
          php tests/policy-runtime.php
          php tests/cf01-practitioner-contract.php
          php tests/cf01-practitioner.php
          python3 tests/architecture-check.py
          python3 tests/completion-security.py
          python3 tests/release-integrity.py
      - name: Build deterministic one-root package
        run: |
          set -euo pipefail
          python3 tools/build-release.py --output dist-a
          python3 tools/build-release.py --output dist-b
          cmp dist-a/global-doctor-onboarding-09-1.2.0-RC1.zip dist-b/global-doctor-onboarding-09-1.2.0-RC1.zip
          rm -rf dist
          mv dist-a dist
          rm -rf dist-b
      - name: Verify package
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check global-doctor-onboarding-09-1.2.0-RC1.zip.sha256
          python3 ../tools/verify-release.py global-doctor-onboarding-09-1.2.0-RC1.zip ../RELEASE-FILES.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file09-1.2.0-rc1
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
