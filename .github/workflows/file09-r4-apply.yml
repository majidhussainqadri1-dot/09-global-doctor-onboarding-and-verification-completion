name: Apply File 09 R4 Corrective Review

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - id: gate
        run: |
          if [[ -f R4-APPLY-TRIGGER.txt && -f tools/file09-r4-code.patch.b64.part00 && -f tools/file09-r4-code.patch.b64.part07 && -f tools/file09-r4-release-sync.py ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Apply R4 corrections and release evidence
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          cat tools/file09-r4-code.patch.b64.part* > /tmp/file09-r4-code.patch.b64
          base64 -d /tmp/file09-r4-code.patch.b64 > /tmp/file09-r4.patch
          git apply --check /tmp/file09-r4.patch
          git apply /tmp/file09-r4.patch
          python3 tools/file09-r4-release-sync.py
          python3 - <<'PY'
          from pathlib import Path
          for name in ['STATUS.md','RELEASE-MANIFEST-1.3.0.md']:
              p=Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')
          PY
          git rm -f R4-APPLY-TRIGGER.txt tools/file09-r4-code.patch.b64.part* tools/file09-r4-release-sync.py
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        if: steps.gate.outputs.run == 'true'
        with:
          php-version: '8.3'
          coverage: none
          extensions: openssl,fileinfo,gd
      - name: Validate R4 corrected source/package
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          git diff --check
          find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 php -l >/dev/null
          node --check assets/js/onboarding.js
          php tests/security-unit.php
          php tests/membership-adapter.php
          php tests/policy-runtime.php
          php tests/cf01-practitioner-contract.php
          php tests/cf01-practitioner.php
          php tests/cross-file-contracts.php
          python3 tests/architecture-check.py
          python3 tests/completion-security.py
          python3 tests/release-integrity.py
          # rc2-adversarial.py enforces a singular authoritative workflow; it is intentionally deferred
          # until this temporary apply workflow is removed and the final exact-head workflow runs.
          python3 tests/final-hardening.py
          python3 tests/review40-adversarial.py
          python3 tests/latest-plan-parity.py
          python3 tests/advanced-trust-24.py
          python3 tests/eighty-round-audit.py
          python3 tests/eighty-round-audit-r2.py
          python3 tests/eighty-round-audit-r3.py
          python3 tests/eighty-round-audit-r4.py
          EXPECTED_SHA=$(git rev-parse HEAD) GITHUB_SHA=$(git rev-parse HEAD) python3 tools/build-release.py --output dist-a
          EXPECTED_SHA=$(git rev-parse HEAD) GITHUB_SHA=$(git rev-parse HEAD) python3 tools/build-release.py --output dist-b
          cmp dist-a/global-doctor-onboarding-09-1.3.0-RC6.zip dist-b/global-doctor-onboarding-09-1.3.0-RC6.zip
          python3 tools/verify-release.py dist-a/global-doctor-onboarding-09-1.3.0-RC6.zip RELEASE-FILES.txt
      - name: Commit R4 corrections
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          rm -rf dist-a dist-b
          git add -A
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(file09): fourth fresh 80-round corrective assurance'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
