name: File 09 R19 Corrective Apply

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
    paths:
      - r19-apply.json

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0
      - name: Apply exact corrective replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec = json.loads(Path('r19-apply.json').read_text())
          changed = []
          for item in spec['replacements']:
              path = Path(item['path'])
              text = path.read_text()
              old = item['old']
              new = item['new']
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}')
              path.write_text(text.replace(old, new, 1))
              changed.append(str(path))
          Path('/tmp/r19-changed.txt').write_text('\n'.join(changed) + '\n')
          PY
          while IFS= read -r file; do
            case "$file" in
              *.php) php -l "$file" ;;
            esac
          done < /tmp/r19-changed.txt
          rm r19-apply.json
          git diff --check
          git status --short
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          git add -A
          git commit -m "fix(file09): apply R19 corrective review finding"
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
