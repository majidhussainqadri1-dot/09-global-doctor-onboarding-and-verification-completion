name: File 09 R11 Temporary Static Suspicion Scan
on:
  push:
    branches: [codex/file09-1.3.0-rc6-80-round-review]
    paths: ['.github/workflows/file09-r11-static-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Scan database and repository-hygiene suspicion patterns
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          print('=== tracked generated/cache artifacts ===')
          for p in root.rglob('*'):
              if p.is_file() and (p.suffix in {'.pyc','.pyo'} or '__pycache__' in p.parts): print(p)
          print('=== DB read calls without nearby last_error reset/check (heuristic) ===')
          for p in sorted((root/'includes').glob('*.php')):
              s=p.read_text(errors='replace')
              lines=s.splitlines()
              for i,l in enumerate(lines):
                  if re.search(r'\$wpdb->get_(?:row|var|results)\s*\(', l):
                      before='\n'.join(lines[max(0,i-3):i+1])
                      after='\n'.join(lines[i:min(len(lines),i+5)])
                      if '$wpdb->last_error' not in before and '$wpdb->last_error' not in after:
                          print(f'{p}:{i+1}: {l.strip()}')
          print('=== writes mapping false and zero to one generic conflict (heuristic) ===')
          for p in sorted((root/'includes').glob('*.php')):
              lines=p.read_text(errors='replace').splitlines()
              for i,l in enumerate(lines):
                  if re.search(r'1\s*!==\s*\$(?:updated|persisted|claimed|inserted|deleted|ok)', l):
                      print(f'{p}:{i+1}: {l.strip()}')
          print('=== ignored process/publish results (heuristic) ===')
          for p in sorted((root/'includes').glob('*.php')):
              for i,l in enumerate(p.read_text(errors='replace').splitlines(),1):
                  if re.search(r'^\s*(?:GDO_[A-Za-z_]+::(?:publish|process|audit)|self::(?:publish|process))\s*\(',l): print(f'{p}:{i}: {l.strip()}')
          PY