name: File 09 R22 Corrective Apply

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
    paths:
      - r22-apply.json

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0
      - name: Apply exact corrective operations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          spec = json.loads(Path('r22-apply.json').read_text(encoding='utf-8'))
          for path in spec.get('insert_last_error_resets', []):
              p = Path(path)
              lines = p.read_text(encoding='utf-8').splitlines(True)
              out = []
              read_tokens = ('$wpdb->get_results(', '$wpdb->get_row(', '$wpdb->get_var(', '$wpdb->get_col(')
              for line in lines:
                  stripped = line.lstrip()
                  if any(tok in line for tok in read_tokens):
                      prev = out[-1].strip() if out else ''
                      if "$wpdb->last_error = '';" not in prev:
                          indent = line[:len(line)-len(stripped)]
                          out.append(indent + "$wpdb->last_error = '';\n")
                  out.append(line)
              p.write_text(''.join(out), encoding='utf-8')

          for op in spec.get('replacements', []):
              p = Path(op['path'])
              source = p.read_text(encoding='utf-8')
              old = op['old']
              new = op['new']
              count = source.count(old)
              expected = int(op.get('count', 1))
              if count != expected:
                  raise SystemExit(f"{op['path']}: expected {expected} occurrences, found {count}")
              p.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          git add -A
          git commit -m "fix(file09): apply R22 corrective review findings"
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
