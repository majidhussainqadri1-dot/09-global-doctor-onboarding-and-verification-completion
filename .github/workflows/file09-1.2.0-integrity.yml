name: File 09 1.2.0 Integrity
on:
  pull_request:
  push:
    branches: ["codex/**", "audit/**", "main"]
permissions:
  contents: read
jobs:
  verify:
    name: PHP ${{ matrix.php }} exact-source verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.3']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with: {php-version: '${{ matrix.php }}', coverage: none, extensions: 'openssl,fileinfo,gd'}
      - name: Repository hygiene and secret scan
        run: |
          set -euo pipefail
          git diff --check
          test ! -f .gitmodules
          test -z "$(find . -type f \( -name '*.zip' -o -name '*.sql' -o -name '*.sqlite' -o -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) -not -path './.git/*' -print -quit)"
          python3 - <<'PY'
          import pathlib,re
          patterns=[rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',rb'\bgh[pousr]_[A-Za-z0-9]{20,}\b',rb'\bAKIA[0-9A-Z]{16}\b',rb'\bAIza[0-9A-Za-z_-]{35}\b']
          for p in pathlib.Path('.').rglob('*'):
              if p.is_file() and '.git' not in p.parts:
                  data=p.read_bytes()
                  if any(re.search(x,data) for x in patterns): raise SystemExit('possible secret: '+str(p))
          PY
      - name: Syntax and full deterministic suites
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 php -l
          node --check assets/js/onboarding.js
          php tests/security-unit.php
          php tests/membership-adapter.php
          php tests/policy-runtime.php
          php tests/cf01-practitioner-contract.php
          php tests/cf01-practitioner.php
          python3 tests/architecture-check.py
          python3 tests/completion-security.py
          python3 tests/release-integrity.py
      - name: Exact-head evidence
        run: |
          git rev-parse HEAD
          find . -type f -not -path './.git/*' -print0 | sort -z | xargs -0 sha256sum > exact-source-checksums.sha256
          wc -l exact-source-checksums.sha256
