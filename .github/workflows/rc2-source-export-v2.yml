name: RC2 Source Export v2

on:
  push:
    branches:
      - codex/file09-1.2.0-rc2-completion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Record exact head and checksums
        run: |
          git rev-parse HEAD > EXACT-HEAD.txt
          find . -path './.git' -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > EXACT-HEAD-SOURCE-CHECKSUMS.sha256
      - name: Build source archive outside worktree
        run: tar --exclude=.git -czf "$RUNNER_TEMP/file09-rc2-source.tar.gz" .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: file09-rc2-source-v2
          path: ${{ runner.temp }}/file09-rc2-source.tar.gz
          if-no-files-found: error
          retention-days: 1
