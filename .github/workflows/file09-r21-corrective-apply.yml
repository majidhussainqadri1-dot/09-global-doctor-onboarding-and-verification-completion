name: File 09 R21 Corrective Apply

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
    paths:
      - r21-apply.json

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0
      - name: Apply exact corrective specification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec = json.loads(Path('r21-apply.json').read_text(encoding='utf-8'))
          for item in spec.get('replacements', []):
              p = Path(item['path'])
              s = p.read_text(encoding='utf-8')
              old = item['old']
              new = item['new']
              expected = int(item.get('count', 1))
              found = s.count(old)
              if found != expected:
                  raise SystemExit(f'{p}: expected {expected} exact match(es), found {found}')
              p.write_text(s.replace(old, new, expected), encoding='utf-8')
          for item in spec.get('writes', []):
              p = Path(item['path'])
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(item['content'], encoding='utf-8')
          for path in spec.get('deletes', []):
              p = Path(path)
              if p.exists():
                  p.unlink()
          PY
          git diff --check
          find includes -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm r21-apply.json
          git commit -m "${R21_COMMIT_MESSAGE:-fix(file09): apply R21 corrective review finding}"
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
