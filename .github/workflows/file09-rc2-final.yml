name: File 09 RC3 Forty-Round Final Assurance

on:
  pull_request:
  push:
    branches:
      - codex/file09-1.2.0-rc2-final
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-sbom-once:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout branch for one-time SBOM refresh
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.2.0-rc2-final
          fetch-depth: 0
      - name: Recompute release-file SBOM checksums and push
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('.')
          p=root/'SBOM.spdx.json'
          sbom=json.loads(p.read_text(encoding='utf-8'))
          for item in sbom.get('files',[]):
              rel=item.get('fileName','').removeprefix('./')
              if not rel:
                  continue
              path=root/rel
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              for c in item.get('checksums',[]):
                  if c.get('algorithm')=='SHA256': c['checksumValue']=digest
          p.write_text(json.dumps(sbom,indent=2)+'\n',encoding='utf-8',newline='')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SBOM.spdx.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(file09): refresh RC3 SBOM after final ledger update'
            git push origin HEAD:codex/file09-1.2.0-rc2-final
          fi

  verify:
    name: PHP ${{ matrix.php }} source and 40-round adversarial assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact source head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: openssl,fileinfo,gd
      - name: Hygiene, syntax and complete suites
        run: |
          set -euo pipefail
          git diff --check
          test ! -f .gitmodules
          test -z "$(find . -type f \( -name '*.zip' -o -name '*.sql' -o -name '*.sqlite' -o -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) -not -path './.git/*' -print -quit)"
          find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 php -l
          node --check assets/js/onboarding.js
          php tests/security-unit.php
          php tests/membership-adapter.php
          php tests/policy-runtime.php
          php tests/cf01-practitioner-contract.php
          php tests/cf01-practitioner.php
          php tests/cross-file-contracts.php
          python3 tests/architecture-check.py
          python3 tests/completion-security.py
          python3 tests/release-integrity.py
          python3 tests/rc2-adversarial.py
          python3 tests/final-hardening.py
          python3 tests/review40-adversarial.py
      - name: Exact-head source evidence
        run: |
          git rev-parse HEAD | tee exact-head.txt
          test "$(cat exact-head.txt)" = "$EXPECTED_SHA"
          find . -type f -not -path './.git/*' -print0 | sort -z | xargs -0 sha256sum > exact-source-checksums.sha256
          wc -l exact-source-checksums.sha256

  package:
    name: Deterministic RC3 package
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact source head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Build twice and verify parity
        env:
          GITHUB_SHA: ${{ env.EXPECTED_SHA }}
        run: |
          set -euo pipefail
          python3 tools/build-release.py --output dist-a
          python3 tools/build-release.py --output dist-b
          cmp dist-a/global-doctor-onboarding-09-1.2.0-RC3.zip dist-b/global-doctor-onboarding-09-1.2.0-RC3.zip
          python3 tools/verify-release.py dist-a/global-doctor-onboarding-09-1.2.0-RC3.zip RELEASE-FILES.txt
          rm -rf dist && mv dist-a dist && rm -rf dist-b
          git rev-parse HEAD > dist/EXACT-HEAD.txt
          test "$(cat dist/EXACT-HEAD.txt)" = "$EXPECTED_SHA"
          find . -type f -not -path './.git/*' -not -path './dist/*' -print0 | sort -z | xargs -0 sha256sum > dist/EXACT-HEAD-SOURCE-CHECKSUMS.sha256
      - name: Upload exact-head release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file09-1.2.0-rc3-${{ env.EXPECTED_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
