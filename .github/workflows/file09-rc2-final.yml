name: File 09 RC6 Eighty-Round Exact-Head Assurance

on:
  pull_request:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: PHP ${{ matrix.php }} source, legacy, plan, trust and 80-round assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact source head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: openssl,fileinfo,gd
      - name: Hygiene, syntax and complete suites
        run: |
          set -euo pipefail
          git diff --check
          test ! -f .gitmodules
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -not -path './.git/*' -print -quit)"
          test -z "$(find . -type f \( -name '*.zip' -o -name '*.sql' -o -name '*.sqlite' -o -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) -not -path './.git/*' -print -quit)"
          find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 php -l
          node --check assets/js/onboarding.js
          php tests/security-unit.php
          php tests/membership-adapter.php
          php tests/current-file00-1244-runtime.php
          php tests/file00-preverification-intake.php
          php tests/v123-frontend-actor-switch.php
          php tests/v123-private-api-actor-switch.php
          php tests/v123-draft-mutation-actor.php
          php tests/v123-consent-submit-actor.php
          php tests/v123-command-center-actor.php
          php tests/v123-evidence-grant-actor.php
          php tests/v123-application-draft-actor.php
          php tests/policy-runtime.php
          php tests/policy-eligibility-retired-mfa.php
          php tests/cf01-practitioner-contract.php
          php tests/cf01-practitioner.php
          php tests/cross-file-contracts.php
          php tests/v123-transparency-inference.php
          php tests/file03-profile-contracts.php
          python3 tests/architecture-check.py
          python3 tests/completion-security.py
          python3 tests/release-integrity.py
          python3 tests/rc2-adversarial.py
          python3 tests/final-hardening.py
          python3 tests/forty-round-assurance.py
          python3 tests/review40-adversarial.py
          python3 tests/latest-plan-parity.py
          python3 tests/v123-source-symbol-audit.py
          python3 tests/v123-evidence-ledger-guard.py
          python3 tests/advanced-trust-24.py
          python3 tests/eighty-round-audit.py
          python3 tests/eighty-round-audit-r2.py
          python3 tests/eighty-round-audit-r3.py
          python3 tests/eighty-round-audit-r4.py
          python3 tests/eighty-round-audit-r5.py
          python3 tests/eighty-round-audit-r6.py
          python3 tests/eighty-round-audit-r7.py
          python3 tests/eighty-round-audit-r8.py
          python3 tests/eighty-round-audit-r9.py
          python3 tests/eighty-round-audit-r10.py
          python3 tests/eighty-round-audit-r11.py
          python3 tests/ten-round-audit-r12.py
          python3 tests/ten-round-audit-r13.py
          python3 tests/ten-round-audit-r14.py
          python3 tests/ten-round-audit-r15.py
          python3 tests/ten-round-audit-r16.py
          python3 tests/ten-round-audit-r17.py
          python3 tests/ten-round-audit-r18.py
          python3 tests/twenty-round-audit-r19.py
          python3 tests/twenty-round-audit-r20.py
          python3 tests/twenty-round-audit-r21.py
          python3 tests/twenty-round-audit-r22.py
          python3 tests/twenty-round-audit-r23.py
          python3 tests/twenty-round-audit-r24.py
          python3 tests/twenty-round-audit-r25.py
          python3 tests/twenty-round-audit-r26.py
      - name: Exact-head source evidence
        run: |
          git rev-parse HEAD | tee exact-head.txt
          test "$(cat exact-head.txt)" = "$EXPECTED_SHA"
          find . -type f -not -path './.git/*' -print0 | sort -z | xargs -0 sha256sum > exact-source-checksums.sha256
          wc -l exact-source-checksums.sha256

  package:
    name: Deterministic 1.3.0 RC6 package
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact source head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Build twice and verify exact-head package and generated SBOM
        env:
          GITHUB_SHA: ${{ env.EXPECTED_SHA }}
        run: |
          set -euo pipefail
          python3 tools/build-release.py --output dist-a
          python3 tools/build-release.py --output dist-b
          cmp dist-a/global-doctor-onboarding-09-1.3.0-RC6.zip dist-b/global-doctor-onboarding-09-1.3.0-RC6.zip
          python3 tools/verify-release.py dist-a/global-doctor-onboarding-09-1.3.0-RC6.zip RELEASE-FILES.txt
          rm -rf dist && mv dist-a dist && rm -rf dist-b
          git rev-parse HEAD > dist/EXACT-HEAD.txt
          test "$(cat dist/EXACT-HEAD.txt)" = "$EXPECTED_SHA"
          find . -type f -not -path './.git/*' -not -path './dist/*' -print0 | sort -z | xargs -0 sha256sum > dist/EXACT-HEAD-SOURCE-CHECKSUMS.sha256
      - name: Upload exact-head release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file09-1.3.0-rc6-${{ env.EXPECTED_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  cross-owner:
    name: Real File00 owner + File09 consumer PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    env:
      FILE09_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FILE00_SHA: 1fad051c86d530d558be3eb1890d3c6e67bce6e8
    steps:
      - name: Checkout exact File09 consumer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.FILE09_SHA }}
      - name: Checkout pinned public File00 provider
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/00-sabri-membership-core
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.FILE00_SHA }}
          path: .external/file00
      - name: Assert both source identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FILE09_SHA"
          test "$(git -C .external/file00 rev-parse HEAD)" = "$FILE00_SHA"
      - name: Configure PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: openssl
      - name: Genuine owner and consumer runtime contract
        run: |
          set -euo pipefail
          php -l .external/file00/source/sabri-membership-core/includes/class-smc-file09-intake-contract.php
          php -l includes/class-gdo-membership-adapter.php
          php -l tests/file00-owner-consumer-integration.php
          php tests/file00-owner-consumer-integration.php
          php .external/file00/qa/file09-intake-contract-runtime.php
          (cd .external/file00/source/sabri-membership-core && sha256sum -c MANIFEST.sha256)
      - name: Complete pinned File00 source QA and deterministic packaging
        run: |
          set -euo pipefail
          (cd .external/file00 && npm ci --ignore-scripts && npm run verify)
          git -C .external/file00 diff --exit-code -- source

  # Additional verification inside the SINGLE canonical File09 workflow.

  wordpress-mariadb:
    name: File00 + File02 + File09 / WordPress 7.0.1 / MariaDB 11.4
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports: [3306:3306]
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      FILE09_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FILE00_SHA: 1fad051c86d530d558be3eb1890d3c6e67bce6e8
      FILE02_SHA: 224c39bcb8c28f77504c7348dbad41226753c7e8
    steps:
      - name: Checkout exact File09 candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable File00
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/00-sabri-membership-core
          ref: 1fad051c86d530d558be3eb1890d3c6e67bce6e8
          path: .external/file00
          persist-credentials: false
      - name: Checkout immutable File02
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/02-sabri-authentication
          ref: 224c39bcb8c28f77504c7348dbad41226753c7e8
          path: .external/file02
          persist-credentials: false
      - name: Exact-source parity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FILE09_SHA"
          test "$(git -C .external/file00 rev-parse HEAD)" = "$FILE00_SHA"
          test "$(git -C .external/file02 rev-parse HEAD)" = "$FILE02_SHA"
          (cd .external/file00/source/sabri-membership-core && sha256sum -c MANIFEST.sha256)
      - name: PHP 8.3 WordPress extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mysqli,openssl,mbstring,fileinfo,gd,dom,curl,zip
          coverage: none
          tools: none
      - name: Install WordPress 7.0.1 and temporary test keys
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.0.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set SMC_MASTER_KEY 'base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set SMC_MASTER_KEY_ID 'file09-v123-ci' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set SA_MASTER_KEY 'file02-file09-only-ephemeral-ci-test-master-key' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set GDO_KEYRING '{"active":"ci-v1","keys":{"ci-v1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}}' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set GDO_CLAIM_SIGNING_KEY 'file09-v123-only-ephemeral-ci-test-signing-key-2026' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set GDO_PRIVATE_STORAGE_DIR '/tmp/file09-v123-private' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE 'staging' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://file09-smoke.local --title='File09 Ephemeral CI' --admin_user=founder --admin_password='Ephemeral-NonProduction-CI!2026' --admin_email=founder@example.test --skip-email
      - name: Activate exact File00 and File02 dependencies
        shell: bash
        run: |
          set -euo pipefail
          cp -R .external/file00/source/sabri-membership-core /tmp/wordpress/wp-content/plugins/sabri-membership-core
          php /tmp/wp-cli.phar plugin activate sabri-membership-core --path=/tmp/wordpress
          # File00 fresh activation is not equivalent to a completed current schema.
          # Mirror the authoritative File00 MariaDB workflow's guarded migration.
          php /tmp/wp-cli.phar eval '
            $key=SMC_Security::ensure_key_ready();
            if(is_wp_error($key)){fwrite(STDERR,"File00 key readiness failed: ".$key->get_error_code()."\n");exit(51);}
            $audit=SMC_Installer::ensure_audit_infrastructure();
            if(is_wp_error($audit)){fwrite(STDERR,"File00 audit readiness failed: ".$audit->get_error_code()."\n");exit(52);}
            SMC_Schema_Compat::reconcile_verification_queue_index();
            SMC_Installer::maybe_upgrade();
            if(SMC_DB_VERSION!==(string)get_option("smc_db_version","")){fwrite(STDERR,"File00 migration incomplete\n");exit(53);}
            if(SMC_Completion::safe_mode()){fwrite(STDERR,"File00 Safe Mode still active; not bypassing\n");exit(54);}
            if(!class_exists("SMC_CF01_Contract")){fwrite(STDERR,"File00 assurance contract unavailable\n");exit(55);}
            echo "PASS genuine File00 migration and Safe Mode clearance\n";
          ' --path=/tmp/wordpress
          mkdir -p /tmp/wordpress/wp-content/plugins/02-sabri-authentication
          rsync -a --exclude=.git .external/file02/ /tmp/wordpress/wp-content/plugins/02-sabri-authentication/
          php /tmp/wp-cli.phar plugin activate 02-sabri-authentication --path=/tmp/wordpress
      - name: Build deterministic File09 RC6 package and activate it
        shell: bash
        env:
          GITHUB_SHA: ${{ env.FILE09_SHA }}
        run: |
          set -euo pipefail
          python3 tools/build-release.py --output /tmp/file09-dist
          python3 tools/verify-release.py /tmp/file09-dist/global-doctor-onboarding-09-1.3.0-RC6.zip RELEASE-FILES.txt
          unzip -q /tmp/file09-dist/global-doctor-onboarding-09-1.3.0-RC6.zip -d /tmp/wordpress/wp-content/plugins/
          test -f /tmp/wordpress/wp-content/plugins/global-doctor-onboarding-09/global-doctor-onboarding.php
          php /tmp/wp-cli.phar plugin activate global-doctor-onboarding-09 --path=/tmp/wordpress
      - name: Real WordPress and MariaDB source smoke only
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval '
            global $wpdb;
            if(!is_plugin_active("global-doctor-onboarding-09/global-doctor-onboarding.php")){fwrite(STDERR,"File09 inactive\n");exit(40);}
            if((int)get_option("gdo_schema_version",0)!==6){fwrite(STDERR,"File09 schema not 6\n");exit(41);}
            if((int)get_option("gdo_advanced_trust_schema",0)!==2){fwrite(STDERR,"File09 advanced schema not 2\n");exit(42);}
            foreach(array("applications","evidence","credential_checks","trusted_issuers","jurisdiction_rules","reviewer_conflicts","professional_history","verification_passports","monitor_state","upload_sessions") as $name){
              $table=$wpdb->prefix."gdo_".$name;
              if($table!==$wpdb->get_var($wpdb->prepare("SHOW TABLES LIKE %s",$table))){fwrite(STDERR,"Missing table: ".$name."\n");exit(43);}}
            foreach(array("gdo_daily_retention","gdo_notification_outbox","gdo_trust_continuous_monitor") as $name){
              if(!wp_next_scheduled($name)){fwrite(STDERR,"Missing cron: ".$name."\n");exit(44);}}
            if(!GDO_Crypto::available() || is_wp_error(GDO_Storage::health())){fwrite(STDERR,"Private keys or storage unavailable\n");exit(45);}
            $other=get_current_user_id()+1000;
            if(!is_wp_error(GDO_Advanced_Trust::command_center($other))){fwrite(STDERR,"Foreign private command center allowed\n");exit(46);}
            $masked=GDO_API::application_edit_model((object)array("user_id"=>$other,"id"=>42,"profile_json"=>"{\"display_name\":\"PRIVATE\"}"),$other);
            if(!empty($masked["profile"])){fwrite(STDERR,"Foreign applicant private profile returned\n");exit(47);}
            echo "PASS File09 actual WordPress+MariaDB installation/schema/negative actor smoke\n";
          ' --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin status global-doctor-onboarding-09 --path=/tmp/wordpress | grep -Fq 'Status: Active'
      - name: Non-production limitation
        run: echo 'Source CI only; Hostinger staging 0/32, live deployment unverified.'
