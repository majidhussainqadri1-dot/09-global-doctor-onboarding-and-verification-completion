name: Apply File 09 R6 Corrective Review

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - id: gate
        run: |
          set -euo pipefail
          for f in tools/r6-source.part.{00..03} tools/r6-overlay.part.{00..04}; do test -f "$f"; done
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        if: steps.gate.outputs.run == 'true'
        with:
          php-version: '8.3'
          coverage: none
          extensions: openssl,fileinfo,gd
      - name: Apply R6 corrections and evidence
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          BASE=6fa0a5cb7063b6b821bd50c105c735470f589b80
          git diff --exit-code "$BASE" -- \
            includes/class-gdo-advanced-trust.php \
            includes/class-gdo-advanced-trust-hardening.php \
            includes/class-gdo-privacy.php \
            includes/class-gdo-storage.php \
            RELEASE-MANIFEST-1.3.0.md STATUS.md TRACEABILITY.md CHANGELOG.md OPERATIONS.md SECURITY-PRIVACY.md \
            RELEASE-FILES.txt RELEASE-LOCK.json tests/release-integrity.py .github/workflows/file09-rc2-final.yml

          cat tools/r6-source.part.* | base64 -d > /tmp/r6-source.patch.gz
          gzip -dc /tmp/r6-source.patch.gz > /tmp/r6-source.patch
          git apply --check /tmp/r6-source.patch
          git apply /tmp/r6-source.patch

          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-gdo-storage.php')
          s=p.read_text(encoding='utf-8')
          if 'is_link($dir)' not in s and 'is_link( $dir )' not in s:
              raise SystemExit('storage directory symlink guard missing')
          s=s.replace('is_link($dir)','is_link( $dir )',1)
          p.write_text(s,encoding='utf-8')
          PY

          cat tools/r6-overlay.part.* | base64 -d > /tmp/r6-overlay.tar.gz
          tar -xzf /tmp/r6-overlay.tar.gz -C .

          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/advanced-trust-24.py')
          s=p.read_text(encoding='utf-8')
          old='assert "delete( GDO_Advanced_Trust::table( \'verification_passports\' )" in hard\n'
          new="""privacy_erase = hard[hard.index('public static function privacy_erase_application'):hard.index('private static function rest_value')]\nassert 'verification_passports' in privacy_erase\nassert ('checked_delete' in privacy_erase or '$wpdb->delete' in privacy_erase)\nassert 'gdo_privacy_operational_cleanup' in privacy_erase\n"""
          if old not in s:
              raise SystemExit('legacy Advanced Trust privacy erasure assertion missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/release-integrity.py')
          s=p.read_text(encoding='utf-8')
          anchor="builder=(root/'tools/build-release.py').read_text(encoding='utf-8'); verifier=(root/'tools/verify-release.py').read_text(encoding='utf-8')"
          if anchor not in s:
              raise SystemExit('release-integrity insertion anchor missing')
          extra="""for key, expected in {'sixth_review_baseline':'6fa0a5cb7063b6b821bd50c105c735470f589b80','sixth_review_rounds':80,'sixth_defect_rounds':60,'sixth_clean_rounds':20}.items():\n    if lock.get(key) != expected: fail('release lock R6 mismatch '+key)\nif 'REVIEW-80-ROUNDS-RC6-R6.md' not in release_files: fail('RC6 R6 release ledger missing')\n"""
          s=s.replace(anchor,extra+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/file09-rc2-final.yml')
          s=p.read_text(encoding='utf-8')
          anchor='          python3 tests/eighty-round-audit-r5.py\n'
          if anchor not in s:
              raise SystemExit('authoritative workflow R5 anchor missing')
          if 'python3 tests/eighty-round-audit-r6.py' not in s:
              s=s.replace(anchor,anchor+'          python3 tests/eighty-round-audit-r6.py\n',1)
          p.write_text(s,encoding='utf-8')
          PY

          rm -f .github/workflows/file09-r6-apply.yml

      - name: Validate R6 corrected source
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          git diff --check
          find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 php -l >/dev/null
          node --check assets/js/onboarding.js
          php tests/security-unit.php
          php tests/membership-adapter.php
          php tests/policy-runtime.php
          php tests/cf01-practitioner-contract.php
          php tests/cf01-practitioner.php
          php tests/cross-file-contracts.php
          python3 tests/architecture-check.py
          python3 tests/completion-security.py
          python3 tests/release-integrity.py
          python3 tests/rc2-adversarial.py
          python3 tests/final-hardening.py
          python3 tests/review40-adversarial.py
          python3 tests/latest-plan-parity.py
          python3 tests/advanced-trust-24.py
          python3 tests/eighty-round-audit.py
          python3 tests/eighty-round-audit-r2.py
          python3 tests/eighty-round-audit-r3.py
          python3 tests/eighty-round-audit-r4.py
          python3 tests/eighty-round-audit-r5.py
          python3 tests/eighty-round-audit-r6.py
          EXPECTED_SHA=$(git rev-parse HEAD) GITHUB_SHA=$(git rev-parse HEAD) python3 tools/build-release.py --output dist-a
          EXPECTED_SHA=$(git rev-parse HEAD) GITHUB_SHA=$(git rev-parse HEAD) python3 tools/build-release.py --output dist-b
          cmp dist-a/global-doctor-onboarding-09-1.3.0-RC6.zip dist-b/global-doctor-onboarding-09-1.3.0-RC6.zip
          python3 tools/verify-release.py dist-a/global-doctor-onboarding-09-1.3.0-RC6.zip RELEASE-FILES.txt
      - name: Commit R6 source corrections
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          rm -rf dist-a dist-b
          git checkout -- .github/workflows/file09-rc2-final.yml .github/workflows/file09-r6-apply.yml
          git rm -f tools/r6-source.part.* tools/r6-overlay.part.*
          git add -A
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(file09): sixth fresh 80-round corrective assurance'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
