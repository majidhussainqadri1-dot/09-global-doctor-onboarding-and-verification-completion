name: Package File 09 Corrective Release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - audit/file-09-source-review

permissions:
  contents: read

jobs:
  package:
    name: Build reproducible File 09 RC package
    if: github.event_name == 'push' || github.head_ref == 'audit/file-09-source-review'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Verify canonical corrective source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check RELEASE-CHECKSUMS.sha256
          python3 tests/architecture-check.py
          find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 php -l
          php tests/security-unit.php

      - name: Build deterministic WordPress package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, hashlib, json, zipfile

          root = Path('.')
          package_slug = '09-global-doctor-onboarding-and-verification-completion'
          version = '1.1.0-RC1'
          zip_name = f'{package_slug}-{version}.zip'
          inventory = []
          with (root / 'RELEASE-INVENTORY.tsv').open('r', encoding='utf-8', newline='') as handle:
              reader = csv.DictReader(handle, delimiter='\t')
              for row in reader:
                  path = row['path']
                  data = (root / path).read_bytes()
                  actual = hashlib.sha256(data).hexdigest()
                  if actual != row['sha256'] or len(data) != int(row['bytes']):
                      raise SystemExit(f'Inventory mismatch: {path}')
                  inventory.append((path, data))

          if len(inventory) != 23:
              raise SystemExit(f'Expected 23 canonical source files, found {len(inventory)}')

          with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path, data in inventory:
                  info = zipfile.ZipInfo(f'{package_slug}/{path}', date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (0o100644 & 0xFFFF) << 16
                  info.create_system = 3
                  archive.writestr(info, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          zip_bytes = Path(zip_name).read_bytes()
          digest = hashlib.sha256(zip_bytes).hexdigest()
          Path(zip_name + '.sha256').write_text(f'{digest}  {zip_name}\n', encoding='utf-8', newline='')
          report = {
              'package': zip_name,
              'sha256': digest,
              'bytes': len(zip_bytes),
              'entries': len(inventory),
              'root': package_slug + '/',
              'source_tree_sha256': json.loads((root / 'RELEASE-LOCK.json').read_text(encoding='utf-8'))['source_tree_sha256'],
              'merge_authorized': False,
              'staging_authorized': False,
              'production_authorized': False,
          }
          Path('PACKAGE-VERIFICATION.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='')
          print(json.dumps(report, indent=2))
          PY

      - name: Verify package structure and checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check 09-global-doctor-onboarding-and-verification-completion-1.1.0-RC1.zip.sha256
          python3 - <<'PY'
          import csv, zipfile
          slug='09-global-doctor-onboarding-and-verification-completion/'
          expected=[]
          with open('RELEASE-INVENTORY.tsv', encoding='utf-8', newline='') as handle:
              for row in csv.DictReader(handle, delimiter='\t'):
                  expected.append(slug + row['path'])
          with zipfile.ZipFile('09-global-doctor-onboarding-and-verification-completion-1.1.0-RC1.zip') as archive:
              names=archive.namelist()
              if names != expected:
                  raise SystemExit('Package entry order or allowlist mismatch')
              bad=archive.testzip()
              if bad:
                  raise SystemExit('Corrupt package entry: ' + bad)
          print('Reproducible package verification passed.')
          PY

      - name: Upload release-candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file-09-1.1.0-rc1
          path: |
            09-global-doctor-onboarding-and-verification-completion-1.1.0-RC1.zip
            09-global-doctor-onboarding-and-verification-completion-1.1.0-RC1.zip.sha256
            PACKAGE-VERIFICATION.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
