name: Temporary File 09 corrective transfer

on:
  push:
    branches:
      - audit/file-09-source-review
    paths:
      - .github/workflows/bootstrap-file09-corrective.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconstruct:
    if: >-
      github.event_name == 'push' || github.head_ref == 'audit/file-09-source-review'
    name: Reconstruct exact corrective release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/file-09-source-review
          fetch-depth: 0
          persist-credentials: true
      - name: Set up PHP from immutable action
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
      - name: Reconstruct, verify, and commit exact release
        run: |
          set -euo pipefail
          cat .bootstrap/file09-full-corrective.b64.* > /tmp/file09-full-corrective.b64
          base64 --decode /tmp/file09-full-corrective.b64 > /tmp/file09-full-corrective-1.1.0.tar.gz
          echo '8ca41e36057aaec84969b453bd657a449009641f1adac947e0720b522eb7f67b  /tmp/file09-full-corrective-1.1.0.tar.gz' | sha256sum --check --strict
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/file09-full-corrective-1.1.0.tar.gz -C .
          test "$(sha256sum RELEASE-LOCK.json | awk '{print $1}')" = '00c2c294939dced5161daa96467d4e49c8fe6cee0b815661f813299cc0de7cb3'
          test "$(sha256sum BASELINE-LOCK.json | awk '{print $1}')" = 'f80bf3861885cac6935c5b4a824fac02c1ba55dfe95f8316d6118f2478300d4a'
          python3 tests/architecture-check.py
          awk -F '\t' 'NR>1 && $3 ~ /\.php$/ {print $3}' RELEASE-INVENTORY.tsv | while IFS= read -r file; do php -l "$file"; done
          php -l tests/security-unit.php
          php tests/security-unit.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct File 09 verification, credential, and privacy architecture'
          git push origin HEAD:audit/file-09-source-review
