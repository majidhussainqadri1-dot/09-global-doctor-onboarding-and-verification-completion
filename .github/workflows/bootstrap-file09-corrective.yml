name: Temporary File 09 corrective transfer

on:
  push:
    branches:
      - audit/file-09-source-review
    paths:
      - .github/workflows/bootstrap-file09-corrective.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconstruct:
    if: >-
      github.event_name == 'push' || github.head_ref == 'audit/file-09-source-review'
    name: Reconstruct exact corrective release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/file-09-source-review
          fetch-depth: 0
          persist-credentials: true
      - name: Diagnose encoded transfer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, glob, hashlib, pathlib, re, zlib
          files=sorted(glob.glob('.bootstrap/file09-full-corrective.b64.*'))
          blocks=[]
          for index,name in enumerate(files):
              data=re.sub(rb'\s+',b'',pathlib.Path(name).read_bytes())
              print(f'CHUNK {index}: bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
              blocks.append(data)
          encoded=b''.join(blocks)
          print(f'AGGREGATE bytes={len(encoded)} mod4={len(encoded)%4}')
          padded=encoded+b'A'*((-len(encoded))%4)
          raw=base64.b64decode(padded)
          print(f'PADDED DECODE bytes={len(raw)} sha256={hashlib.sha256(raw).hexdigest()} header={raw[:10].hex()}')
          dec=zlib.decompressobj(16+zlib.MAX_WBITS)
          produced=0
          for offset,byte in enumerate(raw):
              try:
                  produced += len(dec.decompress(bytes((byte,))))
              except zlib.error as exc:
                  print(f'ZLIB FAILURE compressed_offset={offset} approximate_base64_offset={offset*4//3} produced={produced} error={exc}')
                  break
          else:
              try:
                  produced += len(dec.flush())
                  print(f'ZLIB COMPLETED produced={produced} eof={dec.eof}')
              except zlib.error as exc:
                  print(f'ZLIB FLUSH FAILURE produced={produced} error={exc}')
          raise SystemExit('Diagnostic run complete')
          PY
