name: Temporary File 09 corrective transfer

on:
  push:
    branches:
      - audit/file-09-source-review
    paths:
      - .github/workflows/bootstrap-file09-corrective.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconstruct:
    if: >-
      github.event_name == 'push' || github.head_ref == 'audit/file-09-source-review'
    name: Reconstruct exact corrective release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/file-09-source-review
          fetch-depth: 0
          persist-credentials: true
      - name: Set up PHP from immutable action
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
      - name: Reconstruct, verify, and commit exact release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, glob, hashlib, pathlib
          expected = [
              (3000, '64194813058ad6420f5c5db8fcfaaea51b3bc858028fef3e5050eb06e09d89da'),
              (3000, '680a41fd60c0089b2165c2265389823c9b8f9817e58efdc221471f0b9a90c92f'),
              (3000, 'fa5fa1386951a55356247c05d280b7d41320daa51af902f2b54b899b2b71018c'),
              (3000, '3b09cccbd57ec7745748a6f7698a1c494d0b5e62ebae0fb0c28d1e3d81109b52'),
              (3000, 'deae498d4f6fd32c4918fcbaf40e8203379f4421ae34302e9bc902b8cfee8603'),
              (3000, '3ff689ed45f2ec80bd0a628ddd077a34568a653d920247d5f7ba35a57a0211e6'),
              (3000, '46aeeeb96e12eaaf21e7651aca1365df66870c9d67740d040dcebcece8c50c77'),
              (3000, '3efd7f875ee4e0c5725c286910745501aec46b6000a68be97a316d7de30efe22'),
              (3000, '50deec29e360ac3e3512b186a3775efce6a9e947fb82d60c92fa1180192e995c'),
              (3000, 'c058e1aacd9c94e4c1d2967622207a777491219d3f992cc4e051a26c306bee1a'),
              (3000, 'fdf07304846a645e4d96e9961c7bd26b4f2d1319497ee9da0075b6b042e48e7f'),
              (3000, 'ecfcdd8bdd145fc57675b72436bee5b670ddd34531d05aaa312f1fb13ec393e3'),
              (3000, '36f898bf207bd6e746eb3bb04479ef48a62a4fb06af8b7a1f77c16ad594b5f9d'),
              (3000, '5d8aac1cb0c32c89b37094695969307daa9c7537274fbe075e93a02ac671b96b'),
              (3000, '195703000f651f8b3a96ba4c7aaabd756f9f9f0a0d31d822c3dc76cf89411660'),
              (884,  'e0228d0fcc7a2287f0c8b41d128670bcd84b25af157d99b6aeb627f2c936993b'),
          ]
          files = sorted(glob.glob('.transfer2/part.*'))
          if len(files) != len(expected):
              raise SystemExit(f'ERROR: expected {len(expected)} transfer parts, found {len(files)}')
          blocks = []
          for index, (path, (size, digest)) in enumerate(zip(files, expected)):
              data = pathlib.Path(path).read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if len(data) != size or actual != digest:
                  raise SystemExit(f'ERROR: transfer part {index:03d} mismatch: bytes={len(data)} sha256={actual}')
              blocks.append(data)
          encoded = b''.join(blocks)
          if len(encoded) != 45884 or len(encoded) % 4:
              raise SystemExit(f'ERROR: encoded archive length mismatch: {len(encoded)}')
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f'ERROR: strict base64 decode failed: {exc}')
          actual = hashlib.sha256(decoded).hexdigest()
          if len(decoded) != 34412 or actual != '0a54b266cbe218ffc2b858f3577627b5a0a490633db73719b98e76515392b752':
              raise SystemExit(f'ERROR: corrective archive mismatch: bytes={len(decoded)} sha256={actual}')
          pathlib.Path('/tmp/file09-corrected-1.1.0.tar.gz').write_bytes(decoded)
          print('Exact corrective transfer verified.')
          PY
          for file in BASELINE-LOCK.json CHECKSUMS.sha256 SOURCE-INVENTORY.tsv SOURCE-PROVENANCE.md; do
            git show 00967193c0825dd11e797de5b640a9eefcf421bb:"$file" > "/tmp/$file"
          done
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/file09-corrected-1.1.0.tar.gz -C .
          cp /tmp/BASELINE-LOCK.json BASELINE-LOCK.json
          cp /tmp/CHECKSUMS.sha256 CHECKSUMS.sha256
          cp /tmp/SOURCE-INVENTORY.tsv SOURCE-INVENTORY.tsv
          cp /tmp/SOURCE-PROVENANCE.md SOURCE-PROVENANCE.md
          test "$(sha256sum BASELINE-LOCK.json | awk '{print $1}')" = 'f80bf3861885cac6935c5b4a824fac02c1ba55dfe95f8316d6118f2478300d4a'
          test "$(sha256sum RELEASE-LOCK.json | awk '{print $1}')" = '5fa5a321e7395b2eb211504a715a39a876f826d41b534684884cea67998a7589'
          python3 tests/architecture-check.py
          awk -F '\t' 'NR>1 && $3 ~ /\.php$/ {print $3}' RELEASE-INVENTORY.tsv | while IFS= read -r file; do php -l "$file"; done
          php -l tests/security-unit.php
          php tests/security-unit.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct File 09 verification, credential, and privacy architecture'
          git push origin HEAD:audit/file-09-source-review
