name: Temporary File 09 transfer bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-file09-transfer.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout baseline transfer branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: baseline/file-09-original-import
          fetch-depth: 0
      - name: Reconstruct and verify exact frontend
        run: |
          mkdir -p includes
          cat .bootstrap/frontend.b64.* | base64 --decode > includes/class-gdo-frontend.php
          echo '1803f8eb89823bc1be17352c101d29ece7129ffb4a529776d675e1cf426ef963  includes/class-gdo-frontend.php' | sha256sum --check --strict
          test "$(wc -c < includes/class-gdo-frontend.php)" = '8373'
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-frontend.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconstruct exact File 09 frontend transfer'
          git push origin HEAD:baseline/file-09-original-import
