name: File 09 R11 Post-Correction Adversarial Scan
on:
  push:
    branches: [codex/file09-1.3.0-rc6-80-round-review]
    paths: ['.github/workflows/file09-r11-postscan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Fresh post-correction scan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          print('=== tracked generated/cache ===')
          for p in root.rglob('*'):
              if p.is_file() and (p.suffix in {'.pyc','.pyo'} or '__pycache__' in p.parts): print(p)
          print('=== update/query write-result ambiguity ===')
          for p in sorted((root/'includes').glob('*.php')):
              ls=p.read_text(errors='replace').splitlines()
              for i,l in enumerate(ls):
                  if '$wpdb->update' in l or '$wpdb->query' in l:
                      window='\n'.join(ls[i:min(len(ls),i+18)])
                      if re.search(r'\$updated\s*=|\$ok\s*=|\$persisted\s*=',l) and 'false ===' not in window and 'false !==' not in window:
                          print(f'{p}:{i+1}: {l.strip()}')
          print('=== DB read without local isolation heuristic ===')
          for p in sorted((root/'includes').glob('*.php')):
              ls=p.read_text(errors='replace').splitlines()
              for i,l in enumerate(ls):
                  if re.search(r'\$wpdb->get_(?:row|var|results)\s*\(',l):
                      before='\n'.join(ls[max(0,i-3):i+1]); after='\n'.join(ls[i:min(len(ls),i+6)])
                      if '$wpdb->last_error' not in before and '$wpdb->last_error' not in after:
                          print(f'{p}:{i+1}: {l.strip()}')
          print('=== raw Throwable message persistence ===')
          for p in sorted((root/'includes').glob('*.php')):
              s=p.read_text(errors='replace')
              for m in re.finditer(r'getMessage\(\)',s):
                  line=s.count('\n',0,m.start())+1
                  print(f'{p}:{line}')
          print('=== source hygiene ===')
          print('gitignore', (root/'.gitignore').exists())
          print('pycache', any('__pycache__' in p.parts for p in root.rglob('*')))
          PY
          git diff --check
          find includes -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l