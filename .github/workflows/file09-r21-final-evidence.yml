name: File 09 R21 Final Evidence Sync

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
    paths:
      - r21-finalize.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0
      - name: Synchronize final R21 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec = json.loads(Path('r21-finalize.json').read_text(encoding='utf-8'))
          for item in spec.get('replacements', []):
              p = Path(item['path'])
              s = p.read_text(encoding='utf-8')
              old = item['old']
              new = item['new']
              expected = int(item.get('count', 1))
              found = s.count(old)
              if found != expected:
                  raise SystemExit(f'{p}: expected {expected} exact match(es), found {found}')
              p.write_text(s.replace(old, new, expected), encoding='utf-8')
          PY
          git diff --check
          python3 tests/twenty-round-audit-r21.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md README.md CHANGELOG.md RELEASE-MANIFEST-1.3.0.md
          git rm r21-finalize.json
          git commit -m "docs(file09): synchronize final R21 release evidence"
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
