name: Apply File 09 corrective patch

on:
  push:
    branches:
      - audit/file-09-source-review
    paths:
      - '.github/workflows/apply-file09-corrective-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Reconstruct, verify, and commit corrected source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/file-09-source-review
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .gdo-transfer -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 6
          cat .gdo-transfer/part-* | base64 --decode > /tmp/file09-corrective-patch.tar.gz
          echo "a379a73772200460462455fed259b6d40cc3fddf441fb83d02c8bd6d02c4eab7  /tmp/file09-corrective-patch.tar.gz" | sha256sum --check -
          tar -tzf /tmp/file09-corrective-patch.tar.gz | while IFS= read -r path; do
            case "$path" in
              /*|../*|*/../*|*/..|..) echo "Unsafe archive path: $path" >&2; exit 1 ;;
            esac
          done
          tar -xzf /tmp/file09-corrective-patch.tar.gz -C .

      - name: Verify corrected source
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/architecture-check.py
          find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 php -l
          php tests/security-unit.php
          git diff --check

      - name: Commit exact corrected source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gdo-transfer
          rm -f .github/workflows/apply-file09-corrective-patch.yml
          git config user.name "Sabri File 09 Corrective Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete File 09 security and verification remediation"
          git push origin HEAD:audit/file-09-source-review
