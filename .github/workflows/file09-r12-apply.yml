name: File 09 R12 Ten-Round Corrective Apply
on:
  push:
    branches: [codex/file09-1.3.0-rc6-80-round-review]
    paths: ['.github/workflows/file09-r12-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0
      - name: Apply verified R12 root-cause corrections
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,zlib
          data=''
          open('/tmp/r12.patch','wb').write(zlib.decompress(base64.b64decode(data)))
          PY
          git apply --check /tmp/r12.patch
          git apply /tmp/r12.patch
          git diff --check
          find includes -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
          grep -q "gdo_submit_evidence_query" includes/class-gdo-application.php
          grep -q "gdo_claim_failure_version_missing" includes/class-gdo-notifications.php
          grep -q "gdo_professional_claim_acknowledged" includes/class-gdo-advanced-trust-hardening.php
          grep -q "records_checked( \$app->id, false )" includes/class-gdo-retention.php
      - name: Commit corrective source and self-clean temporary workflow
        shell: bash
        run: |
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/file09-r12-apply.yml
          git add includes/
          git commit -m 'fix(file09): harden R12 migration trust retention and review paths'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review