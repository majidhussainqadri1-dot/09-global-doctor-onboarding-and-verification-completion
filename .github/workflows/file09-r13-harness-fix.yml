name: File 09 R13 historical harness adaptation

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
    paths:
      - '.github/workflows/file09-r13-harness-fix.yml'

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0
      - name: Adapt historical deletion-proof assertion and self-clean
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/review40-adversarial.py')
          s = p.read_text(encoding='utf-8')
          old = "    require('delete_verified' in privacy and 'deletion_proof' in retention,'physical deletion proof missing'),"
          new = "    require('GDO_Evidence::delete_record_safely' in privacy and 'delete_record_safely' in ev and 'deletion_proof' in ev,'durable physical deletion proof lifecycle missing'),"
          if old not in s:
              raise SystemExit('expected historical assertion not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/file09-r13-harness-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(file09): adapt historical deletion-proof gate to R13 primitive'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
