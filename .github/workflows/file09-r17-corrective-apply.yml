name: File 09 R17 Corrective Apply

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review
    paths:
      - r17-apply.json

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file09-1.3.0-rc6-80-round-review
          fetch-depth: 0

      - name: Apply exact replacements and remove temporary R17 plumbing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          spec = json.loads(Path('r17-apply.json').read_text(encoding='utf-8'))
          for change in spec['changes']:
              path = Path(change['path'])
              text = path.read_text(encoding='utf-8')
              old = change['old']
              new = change['new']
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement, found {count}")
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/file09-r17-corrective-apply.yml r17-apply.json
          git diff --check
          for f in $(git diff --name-only -- '*.php'); do php -l "$f"; done

      - name: Commit corrective source change
        run: |
          set -euo pipefail
          message="chore(file09): remove temporary R17 corrective plumbing"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "$message"
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
