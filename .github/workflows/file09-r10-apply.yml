name: File 09 R10 Source Corrective Apply

on:
  push:
    branches:
      - codex/file09-1.3.0-rc6-80-round-review

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          extensions: openssl,fileinfo,gd
      - name: Apply R10 corrections against frozen R9 exact-head baseline
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ec3ca2dd715e05b66cf29c42f2f996c80987fcd7 HEAD
          python3 tools/r10-source-apply.py
          git rm -f .github/workflows/file09-r10-apply.yml tools/r10-source-apply.py
      - name: Validate corrected source before commit
        run: |
          set -euo pipefail
          git diff --check
          find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 php -l >/dev/null
          node --check assets/js/onboarding.js
          php tests/security-unit.php
          php tests/membership-adapter.php
          php tests/policy-runtime.php
          php tests/cf01-practitioner-contract.php
          php tests/cf01-practitioner.php
          php tests/cross-file-contracts.php
          python3 tests/architecture-check.py
          python3 tests/completion-security.py
          python3 tests/release-integrity.py
          python3 tests/rc2-adversarial.py
          python3 tests/final-hardening.py
          python3 tests/review40-adversarial.py
          python3 tests/latest-plan-parity.py
          python3 tests/advanced-trust-24.py
          python3 tests/eighty-round-audit.py
          python3 tests/eighty-round-audit-r2.py
          python3 tests/eighty-round-audit-r3.py
          python3 tests/eighty-round-audit-r4.py
          python3 tests/eighty-round-audit-r5.py
          python3 tests/eighty-round-audit-r6.py
          python3 tests/eighty-round-audit-r7.py
          python3 tests/eighty-round-audit-r8.py
          python3 tests/eighty-round-audit-r9.py
      - name: Commit corrected R10 source
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'File09 Corrective Assurance Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(file09): tenth fresh source corrective assurance'
          git push origin HEAD:codex/file09-1.3.0-rc6-80-round-review
